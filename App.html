<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dev Config - Horizontal</title>
<style>
  :root {
    --bg: #0f0f13;
    --card-bg: #1c1c22;
    --text: #ffffff;
    --text-muted: #8e8e93;
    --accent: #3b82f6;
    --accent-dark: #2563eb;
    --toggle-off: #3a3a40;
    --toggle-on: #3b82f6;
    --border: #2a2a30;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  body {
    background-color: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }

  /* --- Màn hình nhập Key --- */
  #login-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100;
    padding: 20px;
    transition: opacity 0.3s ease;
  }
  #login-screen.hidden { opacity: 0; pointer-events: none; }
  
  .login-box {
    background: var(--card-bg);
    padding: 30px 24px;
    border-radius: 16px;
    width: 100%;
    max-width: 340px;
    text-align: center;
    border: 1px solid var(--border);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .login-box h2 { margin-bottom: 10px; font-size: 22px; }
  .login-box p { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
  .login-box input {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: #121216;
    color: #fff;
    font-size: 18px;
    text-align: center;
    letter-spacing: 6px;
    margin-bottom: 16px;
    outline: none;
  }
  .login-box input:focus { border-color: var(--accent); }
  .login-box button {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .login-box button:hover { background: var(--accent-dark); }
  .error-msg { color: #ef4444; font-size: 13px; margin-top: 12px; display: none; }

  /* --- Giao diện chính (Ngang) --- */
  #app-container {
    width: 100%;
    max-width: 600px; /* Mở rộng hơn để chứa giao diện ngang */
    display: none;
    flex-direction: column;
    gap: 20px;
  }
  #app-container.active { display: flex; }

  .header { text-align: center; margin-bottom: 8px; }
  .header h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
  .header span { color: var(--accent); font-weight: 400; }
  .header p { color: var(--text-muted); font-size: 13px; margin-top: 6px; }

  /* Khu vực tính năng dạng lưới ngang */
  .features-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
  }

  .feature-card {
    background: var(--card-bg);
    border-radius: 14px;
    padding: 16px;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 12px;
  }

  .feature-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .feature-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .feature-title i { font-style: normal; font-size: 18px; }

  /* Toggle Switch */
  .switch { position: relative; display: inline-block; width: 44px; height: 26px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; inset: 0;
    background-color: var(--toggle-off);
    transition: .3s; border-radius: 34px;
  }
  .slider:before {
    position: absolute; content: "";
    height: 20px; width: 20px; left: 3px; bottom: 3px;
    background-color: white; transition: .3s; border-radius: 50%;
  }
  input:checked + .slider { background-color: var(--toggle-on); }
  input:checked + .slider:before { transform: translateX(18px); }

  /* Phần Độ nhạy tương thích */
  .sensitivity-section {
    background: var(--card-bg);
    border-radius: 14px;
    padding: 16px;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .sens-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .sens-value {
    background: var(--accent);
    color: white;
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
  }
  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
    height: 8px;
    border-radius: 4px;
    cursor: pointer;
  }
</style>
</head>
<body>

<!-- Màn hình nhập Key -->
<div id="login-screen">
  <div class="login-box">
    <h2>🔒 Nhập Key</h2>
    <p>Nhập mã để truy cập cấu hình</p>
    <input type="password" id="key-input" placeholder="••••" maxlength="6">
    <button onclick="checkKey()">Xác nhận</button>
    <div class="error-msg" id="error-msg">Key không đúng. Vui lòng thử lại!</div>
  </div>
</div>

<!-- Giao diện chính -->
<div id="app-container">
  <div class="header">
    <h1>⚙️ Dev <span>Config</span></h1>
    <p>Device Optimization • v1.0</p>
  </div>

  <!-- Các tính năng xếp ngang -->
  <div class="features-grid">
    <div class="feature-card">
      <div class="feature-header">
        <div class="feature-title"><i>🚀</i> Tối ưu máy</div>
        <label class="switch">
          <input type="checkbox" id="toggle-opt">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="feature-card">
      <div class="feature-header">
        <div class="feature-title"><i>🎯</i> Sensitivity</div>
        <label class="switch">
          <input type="checkbox" id="toggle-sens">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="feature-card">
      <div class="feature-header">
        <div class="feature-title"><i>🛡️</i> Chế độ ổn định</div>
        <label class="switch">
          <input type="checkbox" id="toggle-stable">
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </div>

  <!-- Phần Độ nhạy tương thích (Thay thế cho nút Reset) -->
  <div class="sensitivity-section">
    <div class="sens-header">
      <div class="feature-title"><i>⚡</i> Độ nhạy tương thích</div>
      <div class="sens-value" id="sens-value-display">50%</div>
    </div>
    <input type="range" id="sens-slider" min="0" max="100" value="50">
  </div>
</div>

<script>
  // --- Xử lý nhập Key ---
  const APP_KEY = "TDK"; // Bạn có thể đổi key tùy ý

  function checkKey() {
    const input = document.getElementById('key-input').value;
    const errorMsg = document.getElementById('error-msg');
    const loginScreen = document.getElementById('login-screen');
    const appContainer = document.getElementById('app-container');

    if (input === APP_KEY) {
      loginScreen.classList.add('hidden');
      appContainer.classList.add('active');
      errorMsg.style.display = 'none';
    } else {
      errorMsg.style.display = 'block';
      document.getElementById('key-input').value = '';
    }
  }

  // Nhấn Enter để xác nhận
  document.getElementById('key-input').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') checkKey();
  });

  // --- Xử lý thanh trượt Độ nhạy tương thích ---
  const sensSlider = document.getElementById('sens-slider');
  const sensDisplay = document.getElementById('sens-value-display');

  sensSlider.addEventListener('input', function() {
    sensDisplay.textContent = this.value + '%';
    // Thêm hiệu ứng đổi màu nhẹ khi kéo
    const hue = 240 - (this.value * 2.4); // Từ xanh dương sang đỏ
    sensDisplay.style.backgroundColor = `hsl(${hue}, 70%, 50%)`;
  });
</script>
</body>
</html>
