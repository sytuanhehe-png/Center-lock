<?xml version="1.0" encoding="utf-8"?>
<!-- ============================================================ -->
<!-- PATH: app/src/main/AndroidManifest.xml                        -->
<!-- ============================================================ -->
<manifest xmlns:android="http://schemas.android.com/apk/res/android"
    package="com.axion.recoiltrainer">

    <application
        android:allowBackup="true"
        android:icon="@mipmap/ic_launcher"
        android:label="@string/app_name"
        android:theme="@style/Theme.Recoil"
        android:supportsRtl="true">

        <activity
            android:name=".MainActivity"
            android:exported="true"
            android:screenOrientation="portrait">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>

    </application>
</manifest>

<!-- ============================================================ -->
<!-- PATH: app/src/main/res/layout/activity_main.xml               -->
<!-- ============================================================ -->
<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
    android:layout_width="match_parent"
    android:layout_height="match_parent"
    android:orientation="vertical"
    android:background="@color/bg_dark">

    <LinearLayout
        android:layout_width="match_parent"
        android:layout_height="wrap_content"
        android:orientation="horizontal"
        android:padding="12dp"
        android:gravity="center_vertical">

        <TextView
            android:id="@+id/tv_mode"
            android:layout_width="0dp"
            android:layout_height="wrap_content"
            android:layout_weight="1"
            android:text="@string/lbl_mode_default"
            android:textColor="@color/accent_blue"
            android:textSize="15sp"
            android:textStyle="bold" />

        <TextView
            android:id="@+id/tv_score"
            android:layout_width="wrap_content"
            android:layout_height="wrap_content"
            android:text="@string/lbl_score_zero"
            android:textColor="@color/accent_green"
            android:textSize="15sp"
            android:textStyle="bold" />

        <TextView
            android:id="@+id/tv_streak"
            android:layout_width="wrap_content"
            android:layout_height="wrap_content"
            android:text="@string/lbl_streak_zero"
            android:textColor="@color/text_primary"
            android:textSize="15sp"
            android:layout_marginStart="16dp" />

    </LinearLayout>

    <com.axion.recoiltrainer.TrainerView
        android:id="@+id/trainer"
        android:layout_width="match_parent"
        android:layout_height="0dp"
        android:layout_weight="1" />

    <LinearLayout
        android:layout_width="match_parent"
        android:layout_height="wrap_content"
        android:orientation="horizontal"
        android:padding="12dp">

        <Button
            android:id="@+id/btn_mode"
            android:layout_width="0dp"
            android:layout_height="wrap_content"
            android:layout_weight="1"
            android:text="@string/btn_mode"
            android:backgroundTint="@color/accent_blue"
            android:textColor="@color/bg_dark" />

        <Button
            android:id="@+id/btn_reset"
            android:layout_width="0dp"
            android:layout_height="wrap_content"
            android:layout_weight="1"
            android:layout_marginStart="8dp"
            android:text="@string/btn_reset"
            android:backgroundTint="@color/accent_green"
            android:textColor="@color/bg_dark" />

    </LinearLayout>

</LinearLayout>

<!-- ============================================================ -->
<!-- PATH: app/src/main/res/values/strings.xml                     -->
<!-- ============================================================ -->
<resources>
    <string name="app_name">Recoil Trainer</string>
    <string name="lbl_mode_default">Mode: AK</string>
    <string name="lbl_score_zero">Score: 0</string>
    <string name="lbl_streak_zero">Streak: 0</string>
    <string name="btn_mode">Change Pattern</string>
    <string name="btn_reset">Reset</string>
</resources>
