<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DST-KEY</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#070707;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

/* LOGIN */
.login{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:390px;
    padding:30px;
    background:#111;
    border:1px solid #292929;
    border-radius:24px;
    box-shadow:0 20px 60px rgba(0,0,0,.7);
}

.logo{
    text-align:center;
    font-size:32px;
    font-weight:900;
    letter-spacing:3px;
}

.logo span,
.title span{
    color:#ff2020;
}

.subtitle{
    text-align:center;
    color:#888;
    margin:8px 0 28px;
}

input{
    width:100%;
    padding:15px;
    border-radius:13px;
    border:1px solid #333;
    outline:none;
    background:#080808;
    color:#fff;
    font-size:15px;
}

input:focus{
    border-color:#f22;
    box-shadow:0 0 0 3px rgba(255,0,0,.1);
}

button{
    width:100%;
    margin-top:13px;
    padding:15px;
    border:0;
    border-radius:13px;
    background:#e51616;
    color:white;
    font-size:15px;
    font-weight:800;
}

button:active{
    transform:scale(.98);
}

#message{
    min-height:22px;
    text-align:center;
    margin-top:14px;
    color:#aaa;
    font-size:14px;
}

/* APP */
#app{
    display:none;
    min-height:100vh;
    padding:22px 16px 40px;
}

.container{
    width:100%;
    max-width:700px;
    margin:auto;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.title{
    font-size:27px;
    font-weight:900;
}

.status{
    padding:7px 12px;
    border-radius:20px;
    background:#162316;
    color:#65df65;
    font-size:12px;
    font-weight:bold;
}

.cards{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:25px;
}

.card{
    min-height:130px;
    padding:20px;
    background:#111;
    border:1px solid #292929;
    border-radius:18px;
}

.icon{
    font-size:28px;
}

.card h3{
    margin:10px 0 5px;
}

.card p{
    margin:0;
    color:#888;
    font-size:13px;
}

.info{
    margin-top:16px;
    padding:18px;
    background:#111;
    border:1px solid #292929;
    border-radius:18px;
}

.row{
    display:flex;
    justify-content:space-between;
    padding:11px 0;
    border-bottom:1px solid #242424;
}

.row:last-child{
    border-bottom:0;
}

.value{
    color:#ff3030;
    font-weight:700;
}

.logout{
    margin-top:15px;
}

@media(max-width:430px){
    .cards{
        gap:10px;
    }

    .card{
        padding:16px;
    }
}
</style>
</head>

<body>

<!-- MÀN HÌNH NHẬP KEY -->
<section id="login" class="login">

    <div class="login-box">

        <div class="logo">
            DST<span>-KEY</span>
        </div>

        <div class="subtitle">
            Nhập KEY để truy cập ứng dụng
        </div>

        <input
            id="keyInput"
            type="text"
            placeholder="Nhập KEY..."
            autocomplete="off"
        >

        <button id="checkButton" onclick="checkKey()">
            KIỂM TRA KEY
        </button>

        <div id="message"></div>

    </div>

</section>


<!-- GIAO DIỆN APP -->
<section id="app">

    <div class="container">

        <div class="header">

            <div class="title">
                DST<span> APP</span>
            </div>

            <div class="status">
                ● KEY ACTIVE
            </div>

        </div>


        <div class="cards">

            <div class="card">
                <div class="icon">🎯</div>
                <h3>AIM</h3>
                <p>Cài đặt điều khiển</p>
            </div>

            <div class="card">
                <div class="icon">⚙️</div>
                <h3>SETTING</h3>
                <p>Tùy chỉnh ứng dụng</p>
            </div>

            <div class="card">
                <div class="icon">📱</div>
                <h3>DEVICE</h3>
                <p>Thông tin thiết bị</p>
            </div>

            <div class="card">
                <div class="icon">🔐</div>
                <h3>KEY</h3>
                <p>Thông tin KEY</p>
            </div>

        </div>


        <div class="info">

            <div class="row">
                <span>KEY</span>
                <span id="keyShown" class="value">••••••</span>
            </div>

            <div class="row">
                <span>Trạng thái</span>
                <span class="value">Đang hoạt động</span>
            </div>

            <div class="row">
                <span>Hết hạn</span>
                <span id="expires" class="value">
                    Đang tải...
                </span>
            </div>

        </div>


        <div class="logout">
            <button onclick="logout()">
                ĐĂNG XUẤT
            </button>
        </div>

    </div>

</section>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://cvjfzjjjoqrqoymyubdt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_QAYU7JdxLyy2km9eBF3GSw_yQ_dIxvK";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   KIỂM TRA KEY
========================= */

async function checkKey(){

    const input =
        document.getElementById("keyInput");

    const message =
        document.getElementById("message");

    const button =
        document.getElementById("checkButton");

    const key =
        input.value.trim();


    if(!key){

        message.textContent =
            "⚠️ Vui lòng nhập KEY";

        return;
    }


    button.disabled = true;

    button.textContent =
        "ĐANG KIỂM TRA...";


    message.textContent = "";


    const { data, error } =
        await supabaseClient.rpc(
            "check_key",
            {
                input_key:key
            }
        );


    if(error){

        console.error(error);

        message.textContent =
            "❌ Không kết nối được hệ thống";

        button.disabled = false;

        button.textContent =
            "KIỂM TRA KEY";

        return;
    }


    if(data === true){

        await openApp(key);

    }else{

        message.textContent =
            "❌ KEY không hợp lệ hoặc đã hết hạn";

        button.disabled = false;

        button.textContent =
            "KIỂM TRA KEY";
    }
}


/* =========================
   MỞ APP
========================= */

async function openApp(key){

    document.getElementById("login")
        .style.display = "none";

    document.getElementById("app")
        .style.display = "block";


    document.getElementById("keyShown")
        .textContent =
        key.slice(0,4) + "••••";


    const { data } =
        await supabaseClient
        .from("keys")
        .select("expires_at")
        .eq("key_code",key)
        .maybeSingle();


    if(data && data.expires_at){

        const date =
            new Date(data.expires_at);

        document.getElementById("expires")
            .textContent =
            date.toLocaleString("vi-VN");
    }
}


/* =========================
   ĐĂNG XUẤT
========================= */

function logout(){

    document.getElementById("app")
        .style.display = "none";

    document.getElementById("login")
        .style.display = "flex";

    document.getElementById("keyInput")
        .value = "";

    document.getElementById("message")
        .textContent = "";

    document.getElementById("checkButton")
        .disabled = false;

    document.getElementById("checkButton")
        .textContent =
        "KIỂM TRA KEY";
}

</script>

</body>
</html>
